version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetpulse-db
    environment:
      POSTGRES_DB: fleetpulse_db
      POSTGRES_USER: fleet_admin
      POSTGRES_PASSWORD: fleet_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_admin -d fleetpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fleetpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - fleet-net
    healthcheck:
      test: ["CMD", "redis-ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:

networks:
  fleet-net:
    driver: bridge
server:
  port: 8080

spring:
  application:
    name: fleetpulse-api

  # Conexão com o PostgreSQL do Docker
  datasource:
    url: jdbc:postgresql://localhost:5432/fleetpulse_db
    username: fleet_admin
    password: fleet_secure_password_2026
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # DDL controlado 100% pelo Flyway para padrão corporativo
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Migrações Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis para Cache e Estado dos Veículos
  data:
    redis:
      host: localhost
      port: 6379

  # Upload de Documentos Fiscais (PDFs de até 15MB)
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# Configurações de Segurança e Storage
fleetpulse:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration-minutes: 480 # 8 horas
  storage:
    upload-dir: ./storage/documents